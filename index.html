<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1220">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#1a1220;--card:#2b1d2e;--text:#ffe9f1;--ac:#ff7eb6;--ac2:#a8406f;--sh:#5a2a48;--btnt:#2b1d2e;--px:"Press Start 2P","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:10px/1.9 var(--px)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hdr .title{text-align:left}.hdr .pb{margin-bottom:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);overflow:auto;z-index:10;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 30px}
.setp{max-width:560px;margin:20px auto}.setp p{margin:16px 0 6px;color:var(--ac)}
.prev{text-align:center}.prev img{height:140px;image-rendering:pixelated}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.cols label,.acc{display:flex;align-items:center;gap:10px}.acc{justify-content:space-between}
input[type=color]{width:46px;height:30px;border:3px solid var(--ac);background:none;padding:0;cursor:pointer}input[type=color]:disabled{opacity:.35}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.title{font-size:20px;text-align:center;margin:10px 0 18px;color:var(--ac);text-shadow:3px 3px 0 var(--sh)}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:6px 22px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.px{background:var(--card);padding:14px;margin:14px 4px;box-shadow:0 -4px 0 0 var(--ac),0 4px 0 0 var(--ac),-4px 0 0 0 var(--ac),4px 0 0 0 var(--ac)}
.white{background:#fff;color:#000;font-family:Arial,sans-serif}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.scene{position:relative;aspect-ratio:3/2;overflow:hidden;image-rendering:pixelated;background:#000}
.scene svg{position:absolute;inset:0}
.night{position:absolute;inset:0;background:rgba(40,30,90,.22)}.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,240,170,.38),transparent 65%)}
.zz{position:absolute;top:10%;left:60%;color:#cfd8ff;font-size:14px}
.sprite{position:absolute;bottom:3%;left:0;right:0;height:62%;display:flex;justify-content:center}
.bob{height:100%;position:relative}
.sprite img{height:100%;image-rendering:pixelated;display:block;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
.shadow{position:absolute;bottom:-1%;left:50%;width:44%;height:5%;margin-left:-22%;background:rgba(0,0,0,.25);border-radius:50%;animation:sh 2.4s ease-in-out infinite}
.fl{position:absolute;top:8%;color:#ff4f93;font-size:14px;opacity:0;animation:fl 2.4s ease-out infinite}
.hop{animation:hop .6s steps(3) infinite}.wiggle{animation:wig .6s steps(4)}.jump{animation:jump .5s}
.zzz img{filter:grayscale(.4);animation-duration:4s}
.sad{animation:sad 1.4s ease-out forwards}.sad img{filter:grayscale(.5);animation-duration:5s}
.cf{position:absolute;top:-5%;width:7px;height:7px;animation:cf 1.5s linear infinite}
.dr{position:absolute;top:18%;font-size:12px;opacity:0;animation:dr 1.2s linear infinite}
@keyframes cf{0%{top:-5%;transform:rotate(0)}100%{top:105%;transform:rotate(360deg)}}@keyframes sad{to{transform:translateY(8px) rotate(-3deg)}}@keyframes dr{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(60px)}}@keyframes breathe{50%{transform:scale(.985,1.03)}}@keyframes sh{50%{transform:scaleX(.92)}}@keyframes hop{50%{transform:translateY(-10px)}}@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}@keyframes jump{40%{transform:translateY(-26px) scale(1.06)}}@keyframes fl{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
@media(prefers-reduced-motion:reduce){.bob,.sprite img,.shadow,.fl,.dr{animation:none!important}.cf{display:none}}
.c{text-align:center;margin:10px 0 2px}
.bub{border:3px solid var(--ac);padding:8px;margin-bottom:10px}
.in{width:100%;box-sizing:border-box;font:16px "Courier New",monospace;padding:9px;border:3px solid var(--ac);background:var(--bg);color:var(--text);border-radius:0;margin-bottom:8px}
.pb{font:9px var(--px);background:var(--ac);color:var(--btnt);border:0;padding:11px 14px;box-shadow:0 4px 0 var(--ac2);cursor:pointer;margin-bottom:6px}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ac2)}
.chip{font:8px var(--px);background:transparent;color:var(--ac);border:3px solid var(--ac);padding:6px 8px;margin:6px 6px 0 0;cursor:pointer}
.leg{display:flex;gap:16px;font-size:13px;margin-left:6px}.leg i{display:inline-block;width:18px;height:4px;margin-right:5px;vertical-align:middle}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:3px dashed var(--sh);padding:9px 0}
.bar{height:12px;border:3px solid var(--ac);background:var(--bg);margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;border-bottom:3px solid var(--ac);margin-top:6px}.days i{flex:1;background:var(--ac);min-height:3px}
.big{font-size:26px;text-align:center;color:var(--ac)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><h1 class="title">LIFE QUEST</h1><div><button class="pb" id="inst" style="display:none;margin-right:10px">⬇ INSTALL</button><button class="pb" data-act="settings">⚙ SETTINGS</button></div></div>
  <div class="grid">
    <div>
      <section class="px"><div class="top" id="top"></div><div class="scene" id="scene"></div><div class="c" id="mood"></div></section>
      <section class="px"><div class="bub" id="msg"></div><input class="in" id="said" placeholder="Tell me about your day..." autocomplete="off"><button class="pb" data-act="tell">TELL PET</button><div id="chips"></div></section>
    </div>
    <div>
      <section class="px white"><div class="leg"><span><i style="background:#8b3dff"></i>Total</span><span><i style="background:#f5a623"></i>This week</span></div><div id="radar"></div></section>
      <section class="px" id="prog"></section>
    </div>
  </div>
  <section class="px">
    <div class="top"><span>GOALS</span><span id="gc"></span></div>
    <div id="glist"></div>
    <div id="gform">
      <p>NEW GOAL</p>
      <div class="form">
        <input class="in" id="gn" maxlength="14" placeholder="Attribute, e.g. Fitness">
        <input class="in" id="gs" maxlength="40" placeholder="Goal, e.g. Go to the gym">
        <input class="in" id="gk" maxlength="40" placeholder="Extra trigger words (optional)">
        <input class="in" id="gb" maxlength="60" placeholder="Goes against it (optional), e.g. doomscrolling">
        <select class="in" id="gt"><option value="1">1 time per week</option><option value="2">2 times per week</option><option value="3" selected>3 times per week</option><option value="4">4 times per week</option><option value="5">5 times per week</option><option value="6">6 times per week</option><option value="7">7 times per week</option></select>
      </div>
      <button class="pb" data-act="add">ADD GOAL</button> <span id="gmsg"></span>
    </div>
    <div id="gfull" style="display:none">MAX 6 GOALS. Delete one to add another.</div>
  </section>
</div>
<div id="set" class="ov" style="display:none"><div class="px setp">
  <div class="top"><span>SETTINGS</span><button class="chip" data-act="close">✕ CLOSE</button></div>
  <p>PET NAME</p><input class="in" id="pn" maxlength="14" placeholder="Name your pet">
  <p>CHARACTER</p>
  <div class="prev"><img id="prev" alt="Character preview"></div>
  <div class="cols">
    <label>Hair <input type="color" id="c_hair"></label><label>Skin <input type="color" id="c_skin"></label>
    <label>Top <input type="color" id="c_top"></label><label>Pants <input type="color" id="c_pants"></label>
    <label>Shoes <input type="color" id="c_shoes"></label><label>Eyes <input type="color" id="c_eyes"></label>
  </div>
  <button class="chip" data-act="rescol">RESET COLOURS</button>
  <p>OR USE YOUR OWN PIXEL IMAGE (PNG, under 1 MB)</p>
  <input type="file" id="up" accept="image/png,image/gif,image/webp"><br>
  <button class="chip" data-act="defchar">USE DEFAULT CHARACTER</button>
  <div id="setmsg"></div>
  <p>COLOUR THEME</p>
  <div id="themes"></div>
  <p></p><label class="acc">Custom accent colour <input type="color" id="sac"></label>
</div></div>

  s+='<polygon points="'+poly(function(i){return counts[i]||0;})+'" fill="rgba(139,61,255,.25)" stroke="#8b3dff" stroke-width="2.5"/>';
  s+='<polygon points="'+poly(function(i){return week[i]||0;})+'" fill="rgba(245,166,35,.4)" stroke="#f5a623" stroke-width="2.5"/>';
  for(i=0;i<6;i++){var g=S.goals[i];p=pt(i,mx*1.2);
    var an=p[0]<cx-10?"end":p[0]>cx+10?"start":"middle",dy=i==0?-4:i==3?12:4;
    s+='<text x="'+p[0]+'" y="'+(p[1]+dy)+'" text-anchor="'+an+'" font-size="13" fill="'+(g?"#000":"#bbb")+'">'+(g?esc(g.name):"+ goal")+'</text>';}
  return s+'</svg>';
}

function progress(){
  var now=sod(Date.now()),days=[],mx=1,i;
  for(i=13;i>=0;i--){var a=now-i*DAY,c=S.log.filter(function(l){return l.t>=a&&l.t<a+DAY;}).length;days.push(c);mx=Math.max(mx,c);}
  var d0=new Date(now-13*DAY);
  return '<div class="top"><span>PROGRESS</span><span>'+S.log.length+' pts</span></div>'+
  '<div class="big">'+Math.round(weekPct()*100)+'%</div><div class="c">of weekly targets done</div>'+(S.bonus?'<div class="c">🏆 '+S.bonus+' bonus level'+(S.bonus>1?'s':'')+'</div>':'')+'<p></p>'+
  (S.goals.map(function(g){var c=cnt(g,wf());return '<div>'+esc(g.name)+' '+c+'/'+g.target+'</div><div class="bar"><i style="width:'+Math.min(100,c/g.target*100)+'%"></i></div>';}).join("")||'<p>Add goals to see progress.</p>')+
  '<div>LAST 14 DAYS</div><div class="days">'+days.map(function(c){return '<i style="height:'+(c/mx*100)+'%" title="'+c+'"></i>';}).join("")+'</div>'+
  '<div class="top"><span>'+d0.getDate()+'/'+(d0.getMonth()+1)+'</span><span>today</span></div>'+
  '<button class="chip" data-act="reset">RESET ALL</button>';
}

function render(){
  var today=S.log.filter(function(l){return l.t>=sod(Date.now());}).length,h=Math.round(weekPct()*5);
  $("top").innerHTML='<span>'+(S.settings.name?esc(S.settings.name)+' · ':'')+'LV '+level()+'</span><span>'+"♥".repeat(h)+"♡".repeat(5-h)+'</span>';
  $("scene").innerHTML=room()+(today&&!sadNext?'<div class="glow"></div>':'<div class="night"></div><div class="zz">z Z z</div>')+'<div class="sprite"><div class="shadow"></div><div id="bob" class="bob '+(today?"hop":"zzz")+'"><img id="avatar" src="'+AV+'" alt="Your pet"></div>'+(sadNext?'<span class="dr" style="left:44%">💧</span><span class="dr" style="left:55%;animation-delay:.5s">💧</span><span class="dr" style="left:49%;animation-delay:.9s">💧</span>':today?'<span class="fl" style="left:42%">♥</span><span class="fl" style="left:50%;animation-delay:.8s">✦</span><span class="fl" style="left:57%;animation-delay:1.6s">♥</span>':'')+'</div>'+(celebrateNext?confetti():'');
  $("mood").textContent=!S.goals.length?"Add your first goal below!":sadMood?"Sad... but I believe in you! 💪":weekPct()>=1?"All goals complete this week! 🏆":today?"Happy! "+today+" today 😊":"Sleepy... do something! 😢";
  $("msg").textContent=msg;
  $("chips").innerHTML=S.goals.map(function(g){return '<button class="chip" data-act="chip" data-id="'+g.id+'">✓ '+esc(g.name)+'</button>';}).join("");
  $("radar").innerHTML=radar();
  $("prog").innerHTML=progress();
  $("gc").textContent=S.goals.length+"/6";
  $("glist").innerHTML=S.goals.map(function(g){return '<div class="row"><div><b>'+esc(g.name)+'</b> · '+esc(g.sub)+'<br>'+cnt(g,wf())+'/'+g.target+' this week · '+cnt(g)+' total'+(slipN(g)?' · '+slipN(g)+' slip'+(slipN(g)>1?'s':'')+' this week':'')+'</div><button class="chip" data-act="del" data-id="'+g.id+'">✕</button></div>';}).join("")||'<p>No goals yet.</p>';
  var full=S.goals.length>=6;$("gform").style.display=full?"none":"block";$("gfull").style.display=full?"block":"none";
  if(sadNext){var sb=$("bob"),sa=$("avatar");if(sb&&sa){sb.className="bob sad";sa.src=AVS;setTimeout(function(){var b2=$("bob");if(b2&&b2.className==="bob sad"){sadNext=false;render();}},3500);}popNext=false;}
else if(popNext){var bb=$("bob");if(bb){bb.className="bob jump";setTimeout(function(){bb.className="bob hop";},500);}if(celebrateNext)setTimeout(function(){celebrateNext=false;render();},3500);popNext=false;}
}
function act(a,id){
  if(a==="settings"){syncSet();$("set").style.display="block";return;}
  if(a==="close"){$("set").style.display="none";render();return;}
  if(a==="rescol"){S.settings.colors=Object.assign({},DEFC);save();syncSet();applyChar();return;}
  if(a==="defchar"){S.settings.custom="";save();syncSet();applyChar();return;}
  if(a==="tell"){var v=$("said").value.trim();if(!v)return;$("said").value="";
    var good=[],bads=[];S.goals.forEach(function(g){if(bad(g,v))bads.push(g.id);else if(hit(g,v)){if(neg(v))bads.push(g.id);else good.push(g.id);}});
    if(good.length)award(good);var a=msg;
    if(bads.length){slip(bads);if(good.length)msg=a+"  "+msg;}
    if(!good.length&&!bads.length)msg=S.goals.length?"I didn't get that. Use your goal's words or tap a ✓ button.":"Add a goal first!";
  }else if(a==="chip")award([id]);
  else if(a==="del"){S.goals=S.goals.filter(function(g){return g.id!==id;});S.log=S.log.filter(function(l){return l.g!==id;});S.slips=S.slips.filter(function(l){return l.g!==id;});save();}
  else if(a==="reset"){if(!confirm("Delete all goals and progress?"))return;S={goals:[],log:[],slips:[],bonus:0,lastBonus:0,nid:1,settings:S.settings};sadMood=false;save();msg="Fresh start!";}
  else if(a==="add"){var n=$("gn").value.trim(),s=$("gs").value.trim();
    if(!n||!s){$("gmsg").textContent="Fill in the attribute and the goal.";return;}
    if(S.goals.length>=6)return;
    S.goals.push({id:S.nid++,name:n,sub:s,kw:$("gk").value.trim(),bad:$("gb").value.trim(),target:+$("gt").value});save();msg="New goal: "+s;
    $("gn").value=$("gs").value=$("gk").value=$("gb").value="";$("gmsg").textContent="";}
  render();
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b)act(b.dataset.act,+b.dataset.id);});
$("said").addEventListener("keydown",function(e){if(e.key==="Enter")act("tell");});
document.addEventListener("click",function(e){var t=e.target.closest("[data-th]");if(t){S.settings.theme=t.dataset.th;S.settings.accent="";save();applyTheme();syncSet();}});
$("pn").addEventListener("input",function(){S.settings.name=$("pn").value.trim().slice(0,14);save();});
PARTS.forEach(function(k){var el=$("c_"+k);el.addEventListener("input",function(){S.settings.colors[k]=el.value;save();applyChar();});});
$("sac").addEventListener("input",function(){S.settings.accent=$("sac").value;save();applyTheme();});
$("up").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;
  if(f.size>1048576){$("setmsg").textContent="That image is over 1 MB. Please pick a smaller one.";return;}
  var fr=new FileReader();fr.onload=function(){S.settings.custom=fr.result;save();syncSet();applyChar();};fr.readAsDataURL(f);});
applyTheme();render();applyChar(render);
function blinkOnce(){var a=$("avatar"),b=$("bob");if(!a||(b&&b.className==="bob sad"))return;a.src=AVB;setTimeout(function(){var a2=$("avatar"),b2=$("bob");if(a2&&!(b2&&b2.className==="bob sad"))a2.src=AV;},150);}
function blinkLoop(){blinkOnce();if(Math.random()<.25)setTimeout(blinkOnce,320);setTimeout(blinkLoop,1800+Math.random()*3200);}
function wigLoop(){var b=$("bob");if(b&&b.className==="bob zzz"){b.classList.add("wiggle");setTimeout(function(){b.classList.remove("wiggle");},600);}setTimeout(wigLoop,4000+Math.random()*3000);}
setTimeout(blinkLoop,2000);setTimeout(wigLoop,3000);
var deferred=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;$("inst").style.display="inline-block";});
$("inst").addEventListener("click",function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;$("inst").style.display="none";});});
window.addEventListener("appinstalled",function(){$("inst").style.display="none";});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script>
</body>
</html>
